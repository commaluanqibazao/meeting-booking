<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>9楼会议室预定</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 60px 40px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      max-width: 420px;
      width: 90%;
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 24px; color: #1f2937; margin-bottom: 8px; }
    p { color: #6b7280; font-size: 14px; margin-bottom: 32px; line-height: 1.6; }
    .rooms {
      display: flex; gap: 12px; justify-content: center; margin-bottom: 32px;
    }
    .room-tag {
      padding: 6px 14px; border-radius: 8px; font-size: 14px; font-weight: 500;
    }
    .room-tag.gold { background: #fef3c7; color: #92400e; }
    .room-tag.silver { background: #f3f4f6; color: #4b5563; }
    .btn {
      display: inline-block;
      padding: 16px 48px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 4px 14px rgba(59,130,246,0.4);
    }
    .btn:hover { background: #2563eb; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:visited { color: #fff; }
    .footer { margin-top: 24px; font-size: 12px; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🏢</div>
    <h1>9楼会议室预定</h1>
    <p>金沙滩（10人）· 银沙滩（8人）<br>一句话就能预定会议室</p>
    <div class="rooms">
      <span class="room-tag gold">🏖️ 金沙滩</span>
      <span class="room-tag silver">🏖️ 银沙滩</span>
    </div>
    <a href="http://1.14.77.3" class="btn">📅 预定会议室</a>
    <div class="footer">点击按钮跳转到预定系统</div>
  </div>
</body>
</html>
